version: 2

models:
  - name: dim_bank
    description: "Bank dimension — one row per bank with type classification"
    columns:
      - name: bank_key
        tests: [not_null, unique]
      - name: bank_name
        tests: [not_null, unique]
      - name: bank_type
        tests:
          - accepted_values:
              arguments:
                values: ['online', 'traditional']

  - name: dim_product
    description: "Product dimension — savings and CD products with display names"
    columns:
      - name: product_key
        tests: [not_null, unique]
      - name: product_name
        tests:
          - accepted_values:
              arguments:
                values: ['savings', 'cd']

  - name: dim_date
    description: "Date dimension with Fed rate cycle classification"
    columns:
      - name: date_day
        tests: [not_null, unique]

  - name: fact_deposit_rates
    description: "Fact table — one row per bank/product with current APY and spread vs. Fed rate"
    columns:
      - name: bank_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bank')
                field: bank_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: apy_pct
        tests: [not_null]
      - name: passthrough_pct
        tests: [not_null]

  - name: fct_savings_offers
    description: "Recommendable savings offers: Bankrate editorial picks from the latest snapshot, with promo terms, minimums, and official URL"
    columns:
      - name: bank_name
        tests: [not_null, unique]
      - name: apy_pct
        tests: [not_null]
      - name: min_balance_for_apy
        tests: [not_null]

  - name: fct_savings_rate_history
    description: "Weekly APY history per editorial bank, unioned across all snapshots"
    columns:
      - name: bank_name
        tests: [not_null]
      - name: rate_date
        tests: [not_null]
      - name: apy_pct
        tests: [not_null]
