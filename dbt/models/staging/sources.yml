version: 2

sources:
  - name: raw
    database: deposit_analytics
    schema: RAW
    tables:
      - name: fred_observations
        columns:
          - name: series_id
            tests: [not_null]
          - name: observation_date
            tests: [not_null]
          - name: value
            tests: [not_null]
      - name: bankrate_rates
        columns:
          - name: bank_name
            tests: [not_null]
          - name: apy_pct
            tests: [not_null]
      - name: bankrate_savings_offers
        columns:
          - name: bank_name
            tests: [not_null]
      - name: bankrate_rate_history
        columns:
          - name: rate_date
            tests: [not_null]
      - name: big_bank_savings_rates
        columns:
          - name: bank_name
            tests: [not_null]
          - name: apy_pct
            tests: [not_null]
          - name: last_checked
            tests: [not_null]
