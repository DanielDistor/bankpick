name: Refresh Data

# Daily ELT: FRED API + Bankrate scrape -> DuckDB -> dbt build -> site/data/rates.json,
# committed to the repo; "Deploy Site" then publishes site/ to GitHub Pages.
# Everything here is free: public-repo Actions minutes, DuckDB, dbt-duckdb, Pages.

on:
  schedule:
    - cron: '0 12 * * *'   # daily 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        run: python -m pytest -q pipelines/tests

      - name: Run site math tests
        run: node --test 'site/tests/*.test.mjs'

      - name: Extract FRED -> DuckDB
        run: python pipelines/extract_fred.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Scrape Bankrate
        # If Bankrate blocks the runner this week, keep going with the
        # snapshots already in knowledge/raw/ so the site stays up.
        continue-on-error: true
        run: python pipelines/extract_bankrate.py

      - name: Scrape big-bank savings rates
        # Same fallback: if blocked, the last confirmed rates stay (and the
        # site's data-health panel shows how old they are).
        continue-on-error: true
        run: python pipelines/extract_big_banks.py

      - name: Load big-bank rates -> DuckDB
        run: python pipelines/extract_big_banks.py --load

      - name: Parse Bankrate -> DuckDB
        run: python pipelines/parse_bankrate.py

      - name: Parse savings offers + rate history -> DuckDB
        run: python pipelines/parse_savings_offers.py

      - name: dbt build (models + tests)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Export site data
        run: python pipelines/export_site_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/raw site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
