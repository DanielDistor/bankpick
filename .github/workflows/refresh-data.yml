name: Refresh Data

# Weekly ELT: FRED API + Bankrate scrape -> DuckDB -> dbt build -> CSV marts
# committed to dashboard/data/, which Streamlit Community Cloud redeploys from.
# Everything here is free: public-repo Actions minutes, DuckDB, dbt-duckdb.

on:
  schedule:
    - cron: '0 7 * * 0'   # Sundays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        run: python -m pytest -q pipelines/tests

      - name: Extract FRED -> DuckDB
        run: python pipelines/extract_fred.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Scrape Bankrate
        # If Bankrate blocks the runner this week, keep going with the
        # snapshots already in knowledge/raw/ so the dashboard stays up.
        continue-on-error: true
        run: python pipelines/extract_bankrate.py

      - name: Parse Bankrate -> DuckDB
        run: python pipelines/parse_bankrate.py

      - name: dbt build (models + tests)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Export marts for dashboard
        run: python pipelines/export_marts.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/raw dashboard/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
