name: Keep Dashboard Awake

# Streamlit Community Cloud puts apps to sleep after a period without visitors.
# This opens the app in a headless browser and clicks the wake-up button if the
# app is asleep, so the portfolio link always loads.

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://deposit-pricing-analytics-banking.streamlit.app/
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Visit app and wake if sleeping
        run: |
          python - <<'PY'
          import os, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90_000)
              page.wait_for_timeout(10_000)
              wake = page.get_by_role("button", name=re.compile("get this app back up", re.I))
              if wake.count():
                  print("App was asleep; waking it up.")
                  wake.first.click()
                  page.wait_for_timeout(60_000)
              else:
                  print("App is awake.")
              print("Final URL:", page.url)
          PY
